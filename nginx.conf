# App files have no hashed names, so a browser must never keep an old copy:
# with several ES modules, a stale one silently runs yesterday's code. no-cache
# isn't enough, Cloudflare rewrites it to max-age=14400. Only fonts may be kept.
map $uri $cache_control {
    ~^/assets/ "public, max-age=604800";
    default    "no-store";
}

# Behind Coolify's proxy the scheme nginx sees is always http: trust what it says.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript text/html application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The stats server. Docker's resolver plus a variable make nginx look the
    # name up per request, so nginx starts (and serves the app) even when `api`
    # is down: only /api/ answers 502 then.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        client_max_body_size 1m;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;

        # A location with its own add_header drops the server-level ones.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
