<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harness ronda</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!-- index.html carries this sprite; without it every ui.icon() renders as an
       empty <use>, which made the volume icon invisible in screenshots only. -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <defs>
      <symbol id="i-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5.5v13l11-6.5z"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5.5v13l9-6.5z"/><path d="M19 5.5v13"/></symbol>
      <symbol id="i-note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></symbol>
      <symbol id="i-cover" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M4.5 18.5l5-5 3.5 3.5 2.5-2.5 4 4"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3.5v4M16 3.5v4"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5h15M9.5 6.5V4.5h5v2M7 6.5l1 13h8l1-13M10 10.5v5.5M14 10.5v5.5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-warn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5L21.5 20h-19z"/><path d="M12 10v4.5M12 17.5v.5"/></symbol>
      <symbol id="i-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L13 19V5L7.5 9.5z"/><path d="M16 9a4.5 4.5 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4.5h-4a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1h4"/><path d="M14.5 8l4 4-4 4M18 12H9.5"/></symbol>
      <symbol id="i-album" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16M4 12h16M4 17.5h9"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 13.5a4 4 0 0 0 5.7 0l2.3-2.3a4 4 0 0 0-5.7-5.7l-1.1 1.1"/><path d="M13.5 10.5a4 4 0 0 0-5.7 0l-2.3 2.3a4 4 0 0 0 5.7 5.7l1.1-1.1"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    </defs>
  </svg>
  <div id="app"></div>
  <script type="module">
    import * as round from "./src/games/round-game.js";

    // 1x1 opaque PNG scaled by the canvas; same-origin data URL keeps the
    // canvas untainted, which the real cross-origin cover does not.
    const COVER =
      "data:image/svg+xml;base64," +
      btoa(`<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#e0533d"/><stop offset="1" stop-color="#2b2a66"/>
        </linearGradient></defs>
        <rect width="512" height="512" fill="url(#g)"/>
        <circle cx="256" cy="256" r="120" fill="#f5e6c8"/>
        <circle cx="256" cy="256" r="26" fill="#1a1918"/>
      </svg>`);

    const ART = [{ id: "a1", name: "Los Espiritus" }];
    const ALBUM = {
      id: "al1",
      name: "Gratitud",
      artists: ART,
      images: [{ url: COVER }],
      release_date: "2019-05-17",
      fetchedAt: new Date().toISOString(),
    };

    const TRACKLIST = [
      { id: "t1", name: "Tormenta de Tierra", track_number: 1, duration_ms: 254000, artists: ART, uri: "spotify:track:t1" },
      { id: "t2", name: "Gratitud", track_number: 2, duration_ms: 301000, artists: ART, uri: "spotify:track:t2" },
      { id: "t3", name: "Poder Elegir", track_number: 3, duration_ms: 228000, artists: [...ART, { id: "a2", name: "Mariana Paraway" }], uri: "spotify:track:t3" },
      { id: "t4", name: "Agua Ardiente", track_number: 4, duration_ms: 275000, artists: ART, uri: "spotify:track:t4" },
      { id: "t5", name: "Rio Babel", track_number: 5, duration_ms: 199000, artists: ART, uri: "spotify:track:t5" },
      { id: "t6", name: "Tormenta de Tierra", track_number: 6, duration_ms: 310000, artists: ART, uri: "spotify:track:t6" },
    ];

    const TRACK = { ...TRACKLIST[0], album: ALBUM };

    const params = new URLSearchParams(location.search);
    const single = params.get("single") === "1";
    const premium = params.get("premium") !== "0";

    const ctx = {
      navigate: () => {},
      library: {
        getPoolTracks: () => [TRACK],
        getRandomTrack: () => TRACK,
        getLibrary: () => ({ albums: { al1: ALBUM } }),
        getAlbumTracklist: async () => (single ? [TRACKLIST[0]] : TRACKLIST),
        refreshAlbum: async () => ALBUM,
      },
      player: {
        isPremium: () => premium,
        isPrimed: () => true,
        isReady: () => params.get("ready") !== "0",
        prime: async () => true,
        playClip: () => true,
        stop: () => {},
        setVolume: (v) => { window.__setVolumeCalls.push(v); },
      },
      // main.js passes `state: appState`; the volume control reads and writes
      // `state.player.volume` (0-100) there.
      state: { player: { volume: Number(params.get("volume") ?? 80) } },
    };
    // Exposed so the screenshot script can assert the shared value really moved.
    window.__setVolumeCalls = [];
    window.__ctx = ctx;

    // main.js mounts every view inside `main.container.container--wide`; the
    // harness has to do the same or the page gutter it provides goes missing
    // and the round looks flush against the viewport edge.
    const host = document.createElement("main");
    host.className = "container container--wide";
    document.getElementById("app").append(host);
    round.mount(host, ctx);
    window.__ready = true;
  </script>
</body>
</html>
