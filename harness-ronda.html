<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harness ronda</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import * as round from "./src/games/round-game.js";

    // 1x1 opaque PNG scaled by the canvas; same-origin data URL keeps the
    // canvas untainted, which the real cross-origin cover does not.
    const COVER =
      "data:image/svg+xml;base64," +
      btoa(`<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#e0533d"/><stop offset="1" stop-color="#2b2a66"/>
        </linearGradient></defs>
        <rect width="512" height="512" fill="url(#g)"/>
        <circle cx="256" cy="256" r="120" fill="#f5e6c8"/>
        <circle cx="256" cy="256" r="26" fill="#1a1918"/>
      </svg>`);

    const ART = [{ id: "a1", name: "Los Espiritus" }];
    const ALBUM = {
      id: "al1",
      name: "Gratitud",
      artists: ART,
      images: [{ url: COVER }],
      release_date: "2019-05-17",
      fetchedAt: new Date().toISOString(),
    };

    const TRACKLIST = [
      { id: "t1", name: "Tormenta de Tierra", track_number: 1, duration_ms: 254000, artists: ART, uri: "spotify:track:t1" },
      { id: "t2", name: "Gratitud", track_number: 2, duration_ms: 301000, artists: ART, uri: "spotify:track:t2" },
      { id: "t3", name: "Poder Elegir", track_number: 3, duration_ms: 228000, artists: [...ART, { id: "a2", name: "Mariana Paraway" }], uri: "spotify:track:t3" },
      { id: "t4", name: "Agua Ardiente", track_number: 4, duration_ms: 275000, artists: ART, uri: "spotify:track:t4" },
      { id: "t5", name: "Rio Babel", track_number: 5, duration_ms: 199000, artists: ART, uri: "spotify:track:t5" },
      { id: "t6", name: "Tormenta de Tierra", track_number: 6, duration_ms: 310000, artists: ART, uri: "spotify:track:t6" },
    ];

    const TRACK = { ...TRACKLIST[0], album: ALBUM };

    const params = new URLSearchParams(location.search);
    const single = params.get("single") === "1";
    const premium = params.get("premium") !== "0";

    const ctx = {
      navigate: () => {},
      library: {
        getPoolTracks: () => [TRACK],
        getRandomTrack: () => TRACK,
        getLibrary: () => ({ albums: { al1: ALBUM } }),
        getAlbumTracklist: async () => (single ? [TRACKLIST[0]] : TRACKLIST),
        refreshAlbum: async () => ALBUM,
      },
      player: {
        isPremium: () => premium,
        isPrimed: () => true,
        prime: async () => true,
        playClip: () => true,
        stop: () => {},
      },
    };

    // main.js mounts every view inside `main.container.container--wide`; the
    // harness has to do the same or the page gutter it provides goes missing
    // and the round looks flush against the viewport edge.
    const host = document.createElement("main");
    host.className = "container container--wide";
    document.getElementById("app").append(host);
    round.mount(host, ctx);
    window.__ready = true;
  </script>
</body>
</html>
